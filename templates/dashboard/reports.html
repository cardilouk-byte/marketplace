{% extends 'dashboard/base_dashboard.html' %}
{% block content %}
<h2 style="margin-bottom:1rem">Rapports - Ventes par mois</h2>
<div class="card">
    <table class="dt">
        <thead><tr><th>Mois</th><th>Total</th></tr></thead>
        <tbody>{% for s in sales %}
            <tr><td>{{ s.month|date:"m/Y" }}</td><td><b>{{ s.total }} HTG</b></td></tr>
        {% empty %}<tr><td colspan="2">Pa gen vant ki konfime.</td></tr>{% endfor %}</tbody>
    </table>
</div>
{% endblock %}
