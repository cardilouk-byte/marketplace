{% extends 'dashboard/base_dashboard.html' %}
{% block content %}
<h2 style="margin-bottom:1rem">{% if user_obj %}Modifier{% else %}Nouveau{% endif %} utilisateur</h2>
<div class="card" style="max-width:560px">
    <form method="post">{% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Enregistrer</button>
        <a class="btn gray" href="{% url 'dashboard:users_list' %}">Annuler</a>
    </form>
</div>
{% endblock %}
