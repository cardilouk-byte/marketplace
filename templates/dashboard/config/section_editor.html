{% extends 'dashboard/base_dashboard.html' %}
{% block content %}
<h2 style="margin-bottom:1rem">{% if section %}Modifier{% else %}Nouvelle{% endif %} section</h2>
<div class="card" style="max-width:640px">
    <form method="post">{% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Enregistrer</button>
        <a class="btn gray" href="{% url 'dashboard:config_homepage' %}">Annuler</a>
    </form>
</div>
{% endblock %}
