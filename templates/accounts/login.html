{% extends 'site/base.html' %}
{% block title %}Connexion - AgroShop{% endblock %}
{% block content %}
<div class="auth-box">
    <div class="card">
        <h2 style="margin-bottom:1rem">Connexion</h2>
        {% if form.errors %}<p style="color:#ef4444;margin-bottom:1rem">Non itilizatè oswa modpas pa bon.</p>{% endif %}
        <form method="post">{% csrf_token %}
            <p><label>Non itilizatè</label>{{ form.username }}</p>
            <p><label>Modpas</label>{{ form.password }}</p>
            <input type="hidden" name="next" value="{{ next }}">
            <button class="btn" type="submit" style="width:100%">Se connecter</button>
        </form>
        <p class="muted" style="margin-top:1rem">Ou pa gen kont? <a href="{% url 'accounts:signup' %}" style="color:var(--primary-blue)">Créer un compte</a></p>
    </div>
</div>
{% endblock %}
